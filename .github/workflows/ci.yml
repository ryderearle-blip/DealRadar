name: DealRadar CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealradar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, and verify staging artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the complete staging gate
        run: pnpm verify
